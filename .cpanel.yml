---
# El servidor cPanel no compila este proyecto.
# El Node del hosting (16 por defecto) no puede construir Next.js 15.
# El build se hace en local o en GitHub Actions (workflow "Export estático").
# A public_html se sube solo el contenido de out/, nunca el repositorio.
# Pasos: README, sección "Publicar en cPanel".
deployment:
  tasks:
    - /bin/echo "creativehut_web: no hay npm ci ni npm run build en el servidor. Publica el contenido de out/ en public_html."
